        "pkg-path": "sops"
      },
      "uv": {
        "pkg-path": "uv"
      }
    },
    "vars": {
      "UV_PYTHON": "3.14"
    },
    "hook": {
      "on-activate": "  # Make the flox-provided libstdc++.so.6 (libgcc) discoverable to Python's\n  # native wheels (grpcio, pulled in by invariant-protocol). Linux only; on\n  # macOS $FLOX_ENV/lib has no libstdc++ and the system libc++ is used.\n  export LD_LIBRARY_PATH=\"$FLOX_ENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"\n"
    },
    "profile": {},
    "options": {},
    "services": {
      "james": {
        "command": "./james serve"
      }
    },
    "containerize": {
      "config": {
        "user": "1000:1000",
        "cmd": [
          "bash",
          "-lc",
          "uv sync --frozen --no-dev && exec ./james serve"
        ],
        "working-dir": "/opt/james"
      }
    }
  },
